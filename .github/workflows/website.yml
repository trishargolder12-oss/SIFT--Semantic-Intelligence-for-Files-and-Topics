name: Website build
on:
  push:
    paths: ['Website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['Website/**', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run build
